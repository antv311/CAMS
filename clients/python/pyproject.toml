[project]
name = "aircd"
version = "0.2.0"
description = "Python client library and agent runtime for aircd IRC server"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
daemon = ["mcp>=1.0"]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
airc = "aircd.cli:main"
airc-bionic = "aircd.bionic:main"
airc-bionic-bench = "aircd.bionic_bench:main"
airc-daemon = "aircd.daemon:main"
airc-bridge = "aircd.bridge:main"
aircd-bionic = "aircd.bionic:main"
aircd-daemon = "aircd.daemon:main"
aircd-bridge = "aircd.bridge:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
